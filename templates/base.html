<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Gestion Logement Universitaire{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --marron: #6f4e37; --bleu: #2f5fa8; --noir: #17171a;
            --gris: #767a82; --gris-clair: #eef0f2; --bordure: #e2e4e8;
        }
        * { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
        body { background: #fafafb; margin: 0; }
        .shell { display: flex; min-height: 100vh; }
        .sidebar { width: 220px; background: var(--noir); color: #cfcfd2; flex-shrink: 0; padding: 22px 14px; }
        .sidebar .brand { color: #fff; font-weight: 600; font-size: 1rem; padding: 0 8px 20px; border-bottom: 1px solid #2a2a2e; margin-bottom: 16px; }
        .sidebar a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 6px; color: #b4b4b8; text-decoration: none; font-size: 0.9rem; margin-bottom: 2px; }
        .sidebar a:hover { background: #232326; color: #fff; }
        .sidebar a.active { background: var(--bleu); color: #fff; }
        .main { flex: 1; padding: 28px 36px; max-width: 1100px; }
        .page-head { margin-bottom: 24px; }
        .page-head h4 { font-weight: 600; color: var(--noir); margin-bottom: 2px; }
        .page-head p { color: var(--gris); font-size: 0.9rem; margin: 0; }
        .row-item { background: #fff; border: 1px solid var(--bordure); border-radius: 8px; padding: 16px 18px; display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 10px; }
        .row-item .left { display: flex; align-items: center; gap: 14px; }
        .row-item .icon-box { width: 38px; height: 38px; border-radius: 6px; background: var(--gris-clair); display: flex; align-items: center; justify-content: center; color: var(--noir); font-size: 1rem; }
        .row-item .label { font-weight: 500; color: var(--noir); font-size: 0.92rem; }
        .row-item .sub { color: var(--gris); font-size: 0.8rem; }
        .tag { font-size: 0.72rem; padding: 3px 9px; border-radius: 20px; font-weight: 500; }
        .tag-marron { background: #efe7e1; color: var(--marron); }
        .tag-bleu { background: #e5ecf7; color: var(--bleu); }
        .tag-gris { background: var(--gris-clair); color: var(--gris); }
        .btn-marron { background: var(--marron); border: none; color: #fff; font-size: 0.85rem; }
        .btn-marron:hover { background: #5a3e2c; color: #fff; }
        .btn-bleu { background: var(--bleu); border: none; color: #fff; font-size: 0.85rem; }
        .btn-bleu:hover { background: #244a85; color: #fff; }
        .btn-line { background: transparent; border: 1px solid var(--bordure); color: var(--noir); font-size: 0.85rem; }
        .btn-line:hover { background: var(--gris-clair); }
        .stat-line { border-bottom: 1px solid var(--bordure); padding: 14px 0; display: flex; justify-content: space-between; align-items: center; }
        .stat-line:last-child { border-bottom: none; }
        .stat-num { font-weight: 600; font-size: 1.15rem; color: var(--noir); }
        .modal-content { border-radius: 10px; border: none; }
        .modal-header { border-bottom: 1px solid var(--bordure); }
    </style>
</head>
<body>
<div class="shell">
    <div class="sidebar">
        <div class="brand"><i class="bi bi-building"></i> Logement Univ.</div>
        <a href="/login/" class="{% if request.path == '/login/' %}active{% endif %}"><i class="bi bi-box-arrow-in-right"></i> Connexion</a>
        <a href="/register/" class="{% if request.path == '/register/' %}active{% endif %}"><i class="bi bi-person-plus"></i> Inscription</a>
        <a href="/etudiant/" class="{% if request.path == '/etudiant/' %}active{% endif %}"><i class="bi bi-mortarboard"></i> Étudiant</a>
        <a href="/espace-admin/" class="{% if request.path == '/espace-admin/' %}active{% endif %}"><i class="bi bi-speedometer2"></i> Administration</a>
        <a href="/agent-technique/" class="{% if request.path == '/agent-technique/' %}active{% endif %}"><i class="bi bi-tools"></i> Agent technique</a>
    </div>
    <div class="main">
        {% block content %}{% endblock %}
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
