{% extends "base.html" %}
{% block title %}Connexion{% endblock %}
{% block content %}
<div class="page-head">
    <h4>Connexion</h4>
    <p>Accédez à votre espace personnel.</p>
</div>
<div style="max-width: 380px;">
    <form>
        <div class="mb-3">
            <label class="form-label small">Email</label>
            <input type="email" class="form-control" placeholder="exemple@univ.mg">
        </div>
        <div class="mb-3">
            <label class="form-label small">Mot de passe</label>
            <input type="password" class="form-control" placeholder="********">
        </div>
        <button type="submit" class="btn btn-bleu w-100">Se connecter</button>
        <p class="mt-3 small">Pas encore de compte ? <a href="/register/">Créer un compte</a></p>
    </form>
</div>
{% endblock %}
