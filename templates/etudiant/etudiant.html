<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Espace Étudiant - Gestion Logement Universitaire</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand">🏠 Gestion Logement Universitaire</span>
            <span class="text-white">Espace Étudiant</span>
        </div>
    </nav>
    <div class="container mt-4">
        <h2>Bienvenue, Étudiant</h2>
        <div class="row mt-4">
            <div class="col-md-4">
                <div class="card shadow p-3 mb-3">
                    <h5>📄 Ma demande de logement</h5>
                    <p>Statut : <span class="badge bg-warning">En attente</span></p>
                    <button class="btn btn-outline-primary btn-sm">Soumettre une demande</button>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card shadow p-3 mb-3">
                    <h5>💰 Mes paiements</h5>
                    <p>Solde du loyer : <strong>0 Ar</strong></p>
                    <button class="btn btn-outline-success btn-sm">Voir les reçus</button>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card shadow p-3 mb-3">
                    <h5>🔧 Signaler une panne</h5>
                    <p>Déclarez un problème technique</p>
                    <button class="btn btn-outline-danger btn-sm">Déclarer une panne</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
