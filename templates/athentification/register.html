{% extends "base.html" %}
{% block title %}Inscription{% endblock %}
{% block content %}
<div class="page-head">
    <h4>Créer un compte</h4>
    <p>Renseignez vos informations pour rejoindre la plateforme.</p>
</div>
<div style="max-width: 380px;">
    <form>
        <div class="mb-3">
            <label class="form-label small">Nom complet</label>
            <input type="text" class="form-control" placeholder="Votre nom">
        </div>
        <div class="mb-3">
            <label class="form-label small">Numéro étudiant</label>
            <input type="text" class="form-control" placeholder="Ex: 102723">
        </div>
        <div class="mb-3">
            <label class="form-label small">Email</label>
            <input type="email" class="form-control" placeholder="exemple@univ.mg">
        </div>
        <div class="mb-3">
            <label class="form-label small">Mot de passe</label>
            <input type="password" class="form-control">
        </div>
        <button type="submit" class="btn btn-marron w-100">S'inscrire</button>
        <p class="mt-3 small">Déjà inscrit ? <a href="/login/">Se connecter</a></p>
    </form>
</div>
{% endblock %}
