<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion - Gestion Logement Universitaire</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand">🏠 Gestion Logement Universitaire</span>
        </div>
    </nav>
    <div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
        <div class="card shadow p-4" style="width: 400px;">
            <h3 class="text-center mb-4">Connexion</h3>
            <form>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" placeholder="exemple@univ.mg">
                </div>
                <div class="mb-3">
                    <label class="form-label">Mot de passe</label>
                    <input type="password" class="form-control" placeholder="********">
                </div>
                <button type="submit" class="btn btn-primary w-100">Se connecter</button>
                <p class="text-center mt-3"><a href="/register/">Pas de compte ? S'inscrire</a></p>
            </form>
        </div>
    </div>
</body>
</html>
